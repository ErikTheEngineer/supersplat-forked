
name: Fetch Updates from Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2
        with:
          repository: LailaMoooooo/supersplat-forked
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream repository
        run: git remote add upstream https://github.com/playcanvas/supersplat.git

      - name: Fetch updates from upstream
        run: git fetch upstream

      - name: Merge updates from upstream
        run: git merge upstream/main

      - name: Push updates to Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          git remote set-url origin https://$(AZURE_DEVOPS_PAT)@dev.azure.com/your-organization/your-project/_git/supersplat
          git push origin HEAD:main
